# Background music manifest. ONLY tracks listed here (with an allowed licence AND proof) are ever used.
# Allowed licences are set in config/providers.yaml -> music_sources.allowed_licences.
# Put the audio file in assets/music/ and add an entry, e.g.:
#
# tracks:
#   - file: cinematic_rise.mp3
#     title: "Cinematic Rise"
#     creator: "Artist Name"
#     licence: "YouTube Audio Library"          # must be in allowed_licences
#     licence_url: "https://studio.youtube.com/channel/UC/music"
#     source_url: "https://..."                 # where you downloaded it
#     proof: "Downloaded from YouTube Audio Library 2026-11-07, 'No attribution required'"
#     attribution: ""                           # text to add to description if the licence requires it
#     commercial_use: true
#     moods: [cinematic, epic]
#
# With no tracks, videos are produced with narration only (no music) — never with unlicensed music.
tracks:
- file: original_ambient_pad.mp3
  title: Original Ambient Pad
  creator: GLOBAL TOP 10 AI (synthesised)
  licence: Original
  licence_url: ''
  source_url: scripts/make_original_music.py
  proof: Generated locally from sine oscillators by scripts/make_original_music.py
    on 2026-11-07; contains no third-party audio.
  attribution: ''
  commercial_use: true
  moods:
  - cinematic
  - ambient
