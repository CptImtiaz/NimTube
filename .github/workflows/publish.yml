name: Publish slot

# Each run sends the video queued for this slot to Zapier (YouTube: Upload Video).
# Slots (config/settings.yaml -> publishing.slots_utc): 17:30, 23:30, 11:30 UTC.
# Runs start ~20 min early because GitHub can start scheduled workflows late.
on:
  schedule:
    - cron: "10 17 * * *"      # Europe evening   (17:30 UTC)
    - cron: "10 23 * * *"      # Americas evening (23:30 UTC)
    - cron: "10 11 * * *"      # Asia evening     (11:30 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gt10-bot-state
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZAPIER_UPLOAD_HOOK: ${{ secrets.ZAPIER_UPLOAD_HOOK }}
      STATE_PASSPHRASE: ${{ secrets.STATE_PASSPHRASE }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/state.py pull
      - name: Wait until close to the slot (max 20 min)
        run: |
          python - <<'PY'
          import time, datetime as dt
          now = dt.datetime.utcnow()
          for hh, mm in ((17, 30), (23, 30), (11, 30)):
              slot = now.replace(hour=hh, minute=mm, second=0, microsecond=0)
              wait = (slot - now).total_seconds() - 120          # send ~2 min before the slot
              if 0 < wait <= 20 * 60:
                  print(f"waiting {int(wait)}s for {hh:02d}:{mm:02d} UTC"); time.sleep(wait); break
          PY
      - name: Send due video to Zapier
        run: python -m app publish
      - if: always()
        run: python scripts/state.py push
