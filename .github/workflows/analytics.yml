name: Analytics

# Analytics runs on Railway with production; manual alternative only.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gt10-bot-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      STATE_PASSPHRASE: ${{ secrets.STATE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/state.py pull
      - run: python -m app analytics
      - if: always()
        run: python scripts/state.py push
