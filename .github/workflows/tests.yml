name: Tests

on:
  push:
    branches-ignore: [bot-state]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core espeak-ng
      - run: pip install -r requirements-dev.txt
      - name: Unit + integration tests (mock APIs, real FFmpeg)
        run: python -m pytest -q
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
