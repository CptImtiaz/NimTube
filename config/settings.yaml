# GLOBAL TOP 10 AI — main settings. Safe to edit; secrets NEVER go here (use env / GitHub Secrets).
channel:
  name: "GLOBAL TOP 10 AI"
  language: en

production:
  videos_per_day: 3                # 3 videos each night, one per slot below
  target_duration_sec: 90          # narration is planned for this; allowed range below
  min_duration_sec: 60
  max_duration_sec: 180
  words_per_second: 2.5            # narration pace used for planning
  ranking_size: 10

publishing:
  backend: claude_zapier           # claude_zapier = a scheduled Claude task uploads each video via its Zapier
                                   #   connection at the slot (reads the manifest in the queue-YYYYMMDD release)
                                   # zapier = bot posts to a Zapier Catch Hook (ZAPIER_UPLOAD_HOOK)
                                   # youtube_api = YouTube's own scheduling (needs YT_* secrets + passed API audit)
  # Nightly batch: 3 videos are made at 14:00 UTC (22:00 Malaysia) and each is published at one slot.
  # Slots (UTC) are chosen so each hits evening prime time in a different big audience region:
  #   17:30 UTC = 18:30 London / 19:30 Berlin / 23:00 India      -> Europe evening
  #   23:30 UTC = 18:30 New York / 15:30 Los Angeles              -> Americas evening
  #   11:30 UTC = 17:00 India / 19:30 Malaysia / 20:30 Japan      -> Asia evening
  # If you change these, also change the cron lines in .github/workflows/publish.yml.
  # Listed in PRIORITY order: with videos_per_day: 1 only the first slot is used (Americas = largest English audience).
  slots_utc: ["23:30", "17:30", "11:30"]
  slot_send_early_min: 25          # a publish run may send a video up to this many minutes before its slot
  hosting: github_release          # github_release (public repo release assets) | s3 (S3-compatible bucket)
  keep_hosted_days: 2              # hosted copies are deleted after this (YouTube keeps the video)
  link_valid_hours: 24             # only for s3 hosting
  auto_publish: false              # false = upload private only. true = schedule PUBLIC at the slot times.
  visibility: private              # private | unlisted | public  (used only if auto_publish: true)
  schedule_publish_at: null        # e.g. "18:00" (channel-local time below) to use publishAt; null = immediate
  channel_timezone: "Asia/Kuala_Lumpur"
  category_id: "27"                # 27 = Education
  upload_thumbnail: true
  upload_captions: false           # needs the broad youtube.force-ssl scope; captions are burned in anyway
  pinned_comment: false            # needs youtube.force-ssl scope; off by default (least privilege)

trends:
  # Regions used to estimate worldwide interest. Use ISO 3166-1 alpha-2 codes.
  regions: [US, GB, IN, CA, AU, DE, FR, BR, JP, MY, NG, ZA]
  min_countries_for_global: 3      # never call a topic "global" with fewer countries
  youtube_max_results: 50
  news_feeds_per_region: true
  extra_rss_feeds:
    - https://feeds.bbci.co.uk/news/world/rss.xml
    - https://feeds.bbci.co.uk/news/science_and_environment/rss.xml
    - https://feeds.bbci.co.uk/news/technology/rss.xml
  reddit_subreddits: [todayilearned, Damnthatsinteresting, space, technology]  # needs Reddit creds; skipped otherwise

topics:
  evergreen_share: 0.5             # probability weight for evergreen vs trending candidates
  min_topic_score: 60              # 0-100; below this, the topic is rejected
  repeat_block_days: 120           # don't repeat a similar topic within N days
  enabled_niches: [general, science, technology, history, entertainment, animals, business, geography]
  excluded_keywords: [election, shooting, war crimes, suicide, terror, abortion]  # never make videos on these

research:
  mode: auto                       # auto = Tavily search if TAVILY_API_KEY is set, else the AI's own web search
  tavily_queries: 3
  tavily_results_per_query: 6
  max_source_chars: 12000          # per page sent to the AI
  min_independent_sources: 2       # distinct domains per topic
  min_verified_facts_per_entry: 1
  max_source_fetch_kb: 1500
  fetch_timeout_sec: 20

voice:
  provider_order: [elevenlabs, kokoro, openai, edge]   # first configured one wins (espeak is used ONLY in --mock tests)
  openai_voice: onyx                # try: onyx, ash, ballad, sage, verse
  openai_model: gpt-4o-mini-tts
  openai_instructions: >-
    Voice: a seasoned nature-and-science documentary narrator. Deep, warm and resonant, calm authority.
    Tone: awe and curiosity, never salesy. Pacing: unhurried but tight; brief dramatic pause before each
    number reveal and before the final reveal; slightly lift energy on surprising facts.
    Pronunciation: crisp consonants, numbers spoken clearly and completely.
  elevenlabs_model: eleven_multilingual_v2
  align_with_whisper: true          # exact word timings for captions via OpenAI transcription (~$0.01/video)
  polish: "highpass=f=70,acompressor=threshold=-20dB:ratio=3:attack=5:release=90:makeup=2,equalizer=f=3200:t=q:w=1.2:g=2.5,equalizer=f=250:t=q:w=1:g=-1.5"
  elevenlabs_voice_id: ""          # set to a voice you are licensed to use
  edge_voice: en-US-AndrewNeural
  kokoro_voice: am_michael         # free local voice (Apache-2.0). Others: am_fenrir, am_puck, bm_george, bm_fable
  speed: 1.0                       # 0.8 - 1.2
  pitch_hz: 0
  pronunciations:                  # word -> spoken form
    GDP: "G D P"
    km: "kilometres"

visuals:
  footage_providers: [pixabay, coverr, nasa]          # nasa = space/astronomy topics only, no key
  search_image_providers: [nasa_image, openverse]   # real photos before AI images; Openverse = CC0/PD/CC-BY only
  image_providers: [openai_image, gemini_image]  # AI stills, used only when no footage is found
  clips_per_entry: 2
  intro_clips: 2
  data_card_share: 0.25            # share of each entry's time spent on the original data card
  min_footage_share: 0.7           # private/publish runs STOP if fewer entries than this have real footage
  min_unique_assets: 12
  grade: "eq=contrast=1.06:saturation=1.08:brightness=-0.02,vignette=PI/5"   # consistent cinematic look

video:
  width: 1080
  height: 1920
  fps: 30
  crf: 20
  preset: veryfast
  loudness_lufs: -14
  music_volume: 0.18
  transition_sec: 0.35
  hook_teaser: true                # open on a 1.5 s flash of the #1 footage with the on-screen hook
  sfx: true                        # original whoosh / impact / riser sounds (synthesised, no licence risk)
  sfx_volume: 0.55

ai:
  # first provider with an API key is used; the rest are automatic fallbacks.
  # nvidia (free build.nvidia.com key) is TRIAL/TESTING ONLY per NVIDIA's terms — keep it last for published videos.
  # NOTE: the free build.nvidia.com key is TRIAL/TESTING ONLY per NVIDIA's terms (production needs NVIDIA AI Enterprise
  # or a paid partner endpoint). Chosen by the channel owner as default; Gemini and the others remain fallbacks.
  llm_provider_order: [omniroute, nvidia, gemini, anthropic, openai, deepseek, openrouter]
  nvidia_model: auto                # auto = first available from the preference list below (or set NVIDIA_MODEL)
  nvidia_model_preference:           # DeepSeek V4.1 Flash is the default; Nemotron models are fallbacks
    - deepseek-ai/deepseek-v4.1-flash
    - nvidia/nemotron-3-super-120b-a12b
    - nvidia/nemotron-3.5-lightning-30b-a3b
    - nvidia/nemotron-3-nano-30b-a3b
    - nvidia/llama-3.3-nemotron-super-49b-v1.5
  deepseek_model: deepseek-chat
  openrouter_model: "deepseek/deepseek-v4-flash:free"
  # OmniRoute gateway (OMNIROUTE_BASE_URL + OMNIROUTE_API_KEY). "auto" = first preferred model the gateway lists,
  # or set OMNIROUTE_MODEL to a model / combo name from your OmniRoute dashboard.
  omniroute_model: auto
  omniroute_model_preference: [deepseek/deepseek-v4-flash, gemini/gemini-3.8-flash, kimi/kimi-k2, glm/glm-4.6]
  anthropic_model: claude-sonnet-5-5
  anthropic_research_model: claude-sonnet-5-5
  anthropic_max_searches: 8
  anthropic_prices_per_mtok: null    # e.g. [3.0, 15.0] — fill in from the Claude pricing page for cost reports
  openai_model: gpt-4.1-mini
  openai_research_model: gpt-4.1
  gemini_model: auto                # auto = newest stable Flash model your key can use (or set an exact ID / GEMINI_MODEL)
  gemini_research_model: ""         # optional separate research model (gemini-2.5-flash is retired for new users)
  gemini_min_seconds_between_calls: 6   # free tier has a low requests-per-minute limit
  temperature: 0.6
